<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Krishi Clinic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Krishi Clinic</h1>
    <p class="tagline">Plant Disease Detector for Farmers</p>
  </header>

  <main>
    <section class="auth-section">
      <h2>Login to Your Account</h2>

      <div id="loginError" class="error-msg" style="display:none;"></div>

      <label for="loginUsername">Username</label>
      <input type="text" id="loginUsername" placeholder="Enter your username">

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">

      <button id="loginBtn">Login</button>

      <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
    </section>
  </main>

  <footer>
    <p>Made for Indian Farmers | Krishi Clinic 2024</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="auth.js"></script>

</body>
</html>
