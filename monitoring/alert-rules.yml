groups:
  - name: krishi-clinic
    rules:
      - alert: KrishiClinicDown
        expr: up{job=~"krishi-clinic.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Krishi Clinic ({{ $labels.env }}) is not answering /metrics"

      - alert: KrishiClinicHigh5xxRate
        expr: |
          sum by (env) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (env) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: KrishiClinicSlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le, env) (rate(http_request_duration_seconds_bucket{route="static"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency for pages is above 500 ms"

      - alert: KrishiClinicAnalysisFailing
        expr: increase(analyze_failures_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Leaf analysis requests are failing (API key or upstream problem)"
