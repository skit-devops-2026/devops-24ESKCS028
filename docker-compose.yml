# Local stack: app + Prometheus scraping /metrics + Grafana with the
# dashboard from monitoring/ pre-loaded.
#   docker compose up --build -d
#   app        http://localhost:5500
#   prometheus http://localhost:9090
#   grafana    http://localhost:3000  (admin / admin)
services:
  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-local}
    image: ghcr.io/skit-devops-2026/devops-24eskcs028:latest
    container_name: krishi-clinic-app
    ports:
      - "5500:5500"
    environment:
      - PORT=5500
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5500/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: krishi-clinic-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: krishi-clinic-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/krishi-clinic.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
