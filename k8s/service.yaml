apiVersion: v1
kind: Service
metadata:
  name: krishi-clinic-service
  labels:
    app: krishi-clinic
spec:
  # NodePort so the app is reachable from the host on a kind cluster
  # (see k8s/kind-config.yaml); inside the cluster it is krishi-clinic-service:80.
  type: NodePort
  selector:
    app: krishi-clinic
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
