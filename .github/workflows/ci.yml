name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — YOUR WORK STARTS HERE.
  #
  # Uncomment the job below and make it pass. Fill in the Makefile targets for
  # your stack; do not change the target names, because this file calls them.
  #
  # The pipeline must genuinely fail when your tests fail. Do not add
  # continue-on-error or "|| true" to make it green.
  # ---------------------------------------------------------------------------

  build-and-test:
    name: Build and test
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: make install
      - run: make test
      - run: make build

  # ---------------------------------------------------------------------------
  # M5 — Build the container image, smoke-test it, and push it to GHCR.
  # Pull requests build and test the image; only main pushes it.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skit-devops-2026/devops-24eskcs028
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5500:5500 $IMAGE:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fs http://localhost:5500/health && break
            sleep 1
          done
          curl -fs http://localhost:5500/health | grep -q '"commit":"${{ github.sha }}"'
          curl -fs http://localhost:5500/ | grep -qi '<html'
          curl -fs http://localhost:5500/metrics | grep -q 'http_requests_total{'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5500/server.js)" = "404"
          docker logs smoke
          docker rm -f smoke

      - name: Save image for the Kubernetes job
        run: docker save $IMAGE:latest -o /tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # ---------------------------------------------------------------------------
  # M7 — Deploy the image to a throwaway kind cluster and wait for Ready pods.
  # ---------------------------------------------------------------------------
  kubernetes:
    name: Kubernetes deploy (kind)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: krishi
          config: k8s/kind-config.yaml

      - name: Load image into the cluster
        run: |
          docker load -i /tmp/image.tar
          kind load docker-image ghcr.io/skit-devops-2026/devops-24eskcs028:latest --name krishi

      - name: Apply manifests
        run: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/krishi-clinic-deployment --timeout=120s

      - name: Verify through the Service
        run: |
          kubectl get pods -o wide
          kubectl get svc krishi-clinic-service
          curl -fs http://localhost:8080/health
          curl -fs http://localhost:8080/metrics | head -20

      - name: Debug on failure
        if: failure()
        run: |
          kubectl describe deployment krishi-clinic-deployment
          kubectl describe pods -l app=krishi-clinic
          kubectl logs -l app=krishi-clinic --tail=50
