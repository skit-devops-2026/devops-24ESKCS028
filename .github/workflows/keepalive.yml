name: Keep live app awake

# Render's free plan sleeps after ~15 minutes idle and the first request then
# takes 30-60 s. Ping /health regularly so the live URL answers quickly.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://krishi-clinic-24eskcs028.onrender.com/health
