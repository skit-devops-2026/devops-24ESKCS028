<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Krishi Clinic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Krishi Clinic</h1>
    <p class="tagline">Plant Disease Detector for Farmers</p>
  </header>

  <main>
    <section class="auth-section">
      <h2>Create Your Account</h2>

      <div id="registerError" class="error-msg" style="display:none;"></div>
      <div id="registerSuccess" class="success-msg" style="display:none;"></div>

      <label for="regName">Full Name</label>
      <input type="text" id="regName" placeholder="Enter your full name">

      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username">

      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Choose a password">

      <label for="regCrop">Your Main Crop</label>
      <select id="regCrop">
        <option value="">-- Select Your Main Crop --</option>
        <option value="Tomato">Tomato</option>
        <option value="Wheat">Wheat</option>
        <option value="Rice">Rice</option>
        <option value="Corn">Corn</option>
        <option value="Potato">Potato</option>
        <option value="Cotton">Cotton</option>
        <option value="Other">Other</option>
      </select>

      <button id="registerBtn">Register</button>

      <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>

  <footer>
    <p>Made for Indian Farmers | Krishi Clinic 2024</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="auth.js"></script>

</body>
</html>
